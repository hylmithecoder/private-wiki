[package]
name = "mcp-service"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
axum = "0.8.9"
getrandom = "0.4.3"
hex = "0.4.3"
mime_guess = "2.0.5"
rmcp = { version = "3.4.1", features = ["server", "transport-io", "transport-streamable-http-server"] }
rusqlite = { version = "0.37", features = ["bundled"] }
rust-embed = "8.12.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
tokio = { version = "1.53.1", features = ["full"] }
